# Optimization: Turn off Jetifier if your libraries support AndroidX (yours do!)
android.useAndroidX=true
android.enableJetifier=false

# R8 "Full Mode" collapses stack frames MediaPipe 1.0.0's internal
# caller-detection relies on (Graph.<clinit> -> IllegalStateException:
# "no caller found on the stack"), crashing offline background removal.
# Keep compat mode until upstream fixes this.
android.enableR8.fullMode=false

# Optimization: Parallelize the build to find unused code faster
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
