name: Ad-hoc AAB build (signed)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git tag/ref to build'
        required: true
        default: 'v5.6.1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Download Gradle 8.14.4
        run: |
          wget https://services.gradle.org/distributions/gradle-8.14.4-bin.zip -O gradle-8.14.4.zip
          unzip gradle-8.14.4.zip -d gradle-dist
          chmod +x gradle-dist/gradle-8.14.4/bin/gradle

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then
            ./gradle-dist/gradle-8.14.4/bin/gradle wrapper --gradle-version 8.14.4
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # This tag predates the signingConfigs block in app/build.gradle, so
      # bundleRelease here produces an UNSIGNED .aab. Build it unsigned first,
      # then sign it directly with jarsigner afterwards (AABs are jar-signed,
      # not apksigner-signed).
      - name: Build unsigned release AAB
        run: ./gradlew bundleRelease --stacktrace

      - name: Decode release keystore
        run: echo "${{ secrets.BKS }}" | base64 -d > "${{ runner.temp }}/release.keystore"

      - name: Download BouncyCastle provider (needed for BKS keystore)
        run: wget -O "${{ runner.temp }}/bcprov.jar" https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk18on/1.78.1/bcprov-jdk18on-1.78.1.jar

      - name: Sign AAB with jarsigner
        run: |
          set -e
          UNSIGNED=$(ls app/build/outputs/bundle/release/*.aab | head -n1)
          jarsigner -verbose \
            -J-classpath -J"${{ runner.temp }}/bcprov.jar" \
            -providerClass org.bouncycastle.jce.provider.BouncyCastleProvider \
            -providerName BC \
            -keystore "${{ runner.temp }}/release.keystore" \
            -storetype BKS \
            -storepass "${{ secrets.PASSWORD }}" \
            -keypass "${{ secrets.PASSWORD }}" \
            -signedjar "${{ runner.temp }}/ZSticker-${{ inputs.ref }}-signed.aab" \
            "$UNSIGNED" \
            "${{ secrets.ALIAS }}"

      - name: Verify signature
        run: |
          jarsigner -verify -verbose \
            -J-classpath -J"${{ runner.temp }}/bcprov.jar" \
            -providerClass org.bouncycastle.jce.provider.BouncyCastleProvider \
            -providerName BC \
            "${{ runner.temp }}/ZSticker-${{ inputs.ref }}-signed.aab"

      - name: Remove keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release.keystore"

      - name: Upload signed release AAB
        uses: actions/upload-artifact@v4
        with:
          name: ZSticker-${{ inputs.ref }}-release-aab-signed
          path: ${{ runner.temp }}/ZSticker-${{ inputs.ref }}-signed.aab
