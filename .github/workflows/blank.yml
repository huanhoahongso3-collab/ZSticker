name: Android ZSticker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Needed to publish the rolling "dev" prerelease on pushes to main.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      # The repo ships a Gradle wrapper; only fall back to downloading Gradle when it is missing.
      - name: Download Gradle 9.4.0
        if: hashFiles('gradlew') == ''
        run: |
          wget https://services.gradle.org/distributions/gradle-9.4.0-bin.zip -O gradle-9.4.0.zip
          unzip gradle-9.4.0.zip -d gradle-dist
          chmod +x gradle-dist/gradle-9.4.0/bin/gradle

      - name: Generate Gradle wrapper if missing
        if: hashFiles('gradlew') == ''
        run: |
          if [ ! -f ./gradlew ]; then
            echo "Gradle wrapper not found, generating..."
            ./gradle-dist/gradle-9.4.0/bin/gradle wrapper --gradle-version 9.4.0
          else
            echo "Gradle wrapper already exists."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Pushes to main get a signed release APK. Pull requests have no access to secrets,
      # so they build unsigned (app/build.gradle only signs when SIGNING_STORE_FILE is set).
      - name: Decode release keystore (push only)
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.BKS }}" | base64 -d > "${{ runner.temp }}/release.keystore"
          {
            echo "SIGNING_STORE_FILE=${{ runner.temp }}/release.keystore"
            echo "SIGNING_STORE_PASSWORD=${{ secrets.PASSWORD }}"
            echo "SIGNING_KEY_ALIAS=${{ secrets.ALIAS }}"
            echo "SIGNING_KEY_PASSWORD=${{ secrets.PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Build Debug and Release APKs
        env:
          ZS_GIF_HOST_URL: ${{ secrets.ZS_GIF_HOST_URL }}
          ZS_GIF_API_KEY_ID: ${{ secrets.ZS_GIF_API_KEY_ID }}
          ZS_GIF_API_SECRET: ${{ secrets.ZS_GIF_API_SECRET }}
          ZS_BACKUP_PASSWORD: ${{ secrets.ZS_BACKUP_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease -PskipLint --stacktrace

      - name: Remove keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release.keystore"

      - name: Collect outputs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/ZSticker-dev-debug.apk
          REL=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          if [ "${{ github.event_name }}" = "push" ]; then
            cp "$REL" out/ZSticker-dev.apk
          else
            cp "$REL" out/ZSticker-dev-unsigned.apk
          fi
          ls -la out

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZSticker-debug-apk
          path: out/ZSticker-dev-debug.apk

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZSticker-release-apk
          path: |
            out/ZSticker-dev.apk
            out/ZSticker-dev-unsigned.apk
          if-no-files-found: ignore

      # Rolling prerelease: delete the previous "dev" release + tag and recreate it on this commit,
      # so "dev" always holds the latest main build.
      - name: Publish dev prerelease
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=$(git rev-parse --short HEAD)
          VERSION=$(grep -oP "versionName\s+'\K[^']+" app/build.gradle)
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev out/ZSticker-dev.apk out/ZSticker-dev-debug.apk \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Dev build ($SHORT)" \
            --notes "Latest development build from \`main\` at ${{ github.sha }} (app version $VERSION).
          Unstable: may contain unfinished features. Replaced on every push to \`main\`.

          - \`ZSticker-dev.apk\`: signed release build
          - \`ZSticker-dev-debug.apk\`: debug build"
