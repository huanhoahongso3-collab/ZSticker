name: Build Signed Release (APK + AAB)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.ver.outputs.name }}
      code: ${{ steps.ver.outputs.code }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Read version from main
        id: ver
        run: |
          NAME=$(grep -oP "versionName\s+'\K[^']+" app/build.gradle)
          CODE=$(grep -oP "versionCode\s+\K[0-9]+" app/build.gradle)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

  build:
    # Only the current version is released; older versions and the legacy branch are no longer supported.
    needs: version
    strategy:
      fail-fast: false
      matrix:
        branch: [main]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Download Gradle and generate wrapper if missing
        run: |
          if [ "${{ matrix.branch }}" = "main" ]; then
            GRADLE_VER="9.4.0"
          else
            GRADLE_VER="8.14.4"
          fi
          wget "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" -O "gradle-${GRADLE_VER}.zip"
          unzip "gradle-${GRADLE_VER}.zip" -d gradle-dist
          chmod +x "gradle-dist/gradle-${GRADLE_VER}/bin/gradle"
          if [ ! -f ./gradlew ]; then
            echo "Gradle wrapper not found, generating for Gradle ${GRADLE_VER}..."
            "./gradle-dist/gradle-${GRADLE_VER}/bin/gradle" wrapper --gradle-version "${GRADLE_VER}"
          else
            echo "Gradle wrapper already exists."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode release keystore
        run: echo "${{ secrets.BKS }}" | base64 -d > "${{ runner.temp }}/release.keystore"

      - name: Build signed release APK and AAB
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Remove keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release.keystore"

      - name: Rename outputs
        run: |
          mkdir -p "${{ runner.temp }}/out"
          cp app/build/outputs/apk/release/*.apk "${{ runner.temp }}/out/ZSticker-v${{ needs.version.outputs.name }}.apk"
          cp app/build/outputs/bundle/release/*.aab "${{ runner.temp }}/out/ZSticker-v${{ needs.version.outputs.name }}.aab"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ZSticker-release-apk
          path: ${{ runner.temp }}/out/ZSticker-v${{ needs.version.outputs.name }}.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: ZSticker-release-aab
          path: ${{ runner.temp }}/out/ZSticker-v${{ needs.version.outputs.name }}.aab

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.name }}
          name: ZSticker v${{ needs.version.outputs.name }} (${{ needs.version.outputs.code }})
          body: |
            ## What's new in ${{ needs.version.outputs.name }}

            - Favorites and folders: star stickers and filter the Home grid with All, Favorites and folder chips
            - Select several stickers at once to favorite, move, add a border, export or delete them
            - New sticker editor: eraser, a restore brush that brings back removed background, drawing and text, with undo and redo
            - Crop GIFs while they play, with a timeline, play/pause and aspect presets
            - Import short videos with a live trimmer and turn them into GIF stickers
            - Backups are now `.zsticker` files without a password; backups from older versions open with Import legacy backup
            - Auto-crop and auto-resize options for background removal and sharing
            - Material 3 Expressive redesign: floating navigation bar, rounded add button and smoother tab animations
            - Fixes: GIF encoding crash, video import, language flags and Play Console warnings

            Only the latest version is supported; older versions (including the legacy build) are no longer maintained.
          files: artifacts/*
